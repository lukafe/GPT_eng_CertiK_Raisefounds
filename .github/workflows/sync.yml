name: Sync Apollo (1h)

# 24/7, de hora em hora: sincroniza respostas, bounces e follow-ups do Apollo (avisa o
# Lucas por email quando há movimento) e atualiza o estado da conta no monitor Aurora
# (caixa, créditos, sequências). Só leitura no Apollo: não inscreve ninguém.
# Minuto 17 de propósito: na virada da hora o agendador do GitHub atrasa e pula rodadas.
# O Supabase vigia (mon.refresh): se o sync passar de 75 min sem rodar, reaciona este
# workflow, quando houver o segredo github_actions_token no Vault.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: outbound-pipeline
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: outbound
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
      APOLLO_KEY: ${{ secrets.APOLLO_KEY }}
      APOLLO_SEQ_ID: ${{ secrets.APOLLO_SEQ_ID }}
      APOLLO_MAILBOX_ID: ${{ secrets.APOLLO_MAILBOX_ID }}
      MAX_PER_DAY: "40"   # mesmo teto do daily.yml; aqui só serve para o monitor exibir
      NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Sync de status do Apollo
        run: python main.py --steps sync
      - name: Estado do Apollo para o monitor
        if: ${{ !cancelled() }}
        run: python monitor_refresh.py
      - name: Log da rodada
        if: always()
        run: cat log.txt 2>/dev/null || true
