name: Sync status (6h)

# 24/7: sincroniza status do Apollo (replies/bounces/follow-ups) a cada 6h
# e envia notificação por email quando há movimento.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: outbound-pipeline
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: outbound
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
      APOLLO_KEY: ${{ secrets.APOLLO_KEY }}
      APOLLO_SEQ_ID: ${{ secrets.APOLLO_SEQ_ID }}
      NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python main.py --steps sync
      - name: Log da rodada
        if: always()
        run: cat log.txt 2>/dev/null || true
