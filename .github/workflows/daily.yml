name: Daily outbound

# Produção: roda todo dia às 06:00 UTC (healthcheck + pipeline completo).
# Também pode ser disparado na mão pela aba Actions.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (não envia nada ao Apollo)"
        type: boolean
        default: false
      steps:
        description: "Etapas (ex.: push para só inscrever quem já está pronto)"
        default: "fetch,enrich,push,phones,sync"

concurrency:
  group: outbound-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: outbound
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      APOLLO_KEY: ${{ secrets.APOLLO_KEY }}
      APOLLO_SEQ_ID: ${{ secrets.APOLLO_SEQ_ID }}
      APOLLO_MAILBOX_ID: ${{ secrets.APOLLO_MAILBOX_ID }}
      NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      # 16 pessoas novas/dia: a caixa do Apollo manda 50 emails/dia (1º contato + follow-ups)
      # e cada pessoa recebe 3 emails na 1ª semana (D0, D3, D7).
      MAX_PER_DAY: "16"
      COMPANIES_PER_DAY: "40"
      TG_PHONE_REVEALS_PER_DAY: "5"   # telefones de decisores pelo waterfall do Apollo (~8 créditos cada)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name: Healthcheck (aborta o dia se alguma API estiver fora)
        run: python healthcheck.py

      - name: Pipeline
        run: |
          STEPS="${{ inputs.steps }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python main.py --dry-run --steps "${STEPS:-fetch,enrich,push,phones,sync}"
          else
            python main.py --steps "${STEPS:-fetch,enrich,push,phones,sync}"
          fi

      - name: Log da rodada
        if: always()
        run: cat log.txt 2>/dev/null || true
